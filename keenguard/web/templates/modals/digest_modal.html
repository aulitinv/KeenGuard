    <!-- Modal: Security Digest Report -->
    <div id="digest-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-surface-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-3">
                    <div class="p-2 rounded-xl bg-indigo-500/10 text-indigo-400">
                        <i data-lucide="shield-check" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-base text-white">Дайджест безопасности сети</h3>
                        <p class="text-xs text-slate-400" id="digest-period-label">За последние 24 часа</p>
                    </div>
                </div>
                <button onclick="closeDigestModal()" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Score & Stats -->
            <div class="grid grid-cols-2 gap-3 bg-surface-950 p-3.5 rounded-xl border border-slate-800">
                <div>
                    <span class="text-slate-400 text-xs block">Индекс безопасности:</span>
                    <div class="flex items-baseline space-x-2 mt-1">
                        <span id="digest-score-value" class="text-2xl font-bold text-emerald-400">100</span>
                        <span id="digest-score-status" class="text-xs text-emerald-400 font-medium">Отлично</span>
                    </div>
                </div>
                <div>
                    <span class="text-slate-400 text-xs block">Устройств онлайн:</span>
                    <div class="flex items-baseline space-x-1 mt-1">
                        <span id="digest-devices-value" class="text-2xl font-bold text-slate-100">0</span>
                        <span class="text-xs text-slate-500">хостов</span>
                    </div>
                </div>
            </div>

            <!-- Incidents summary -->
            <div class="space-y-2">
                <span class="text-xs font-semibold text-slate-300 block">Сводка инцидентов:</span>
                <div class="grid grid-cols-3 gap-2 text-center text-xs">
                    <div class="bg-surface-950 p-2 rounded-xl border border-slate-800">
                        <span class="text-rose-400 font-bold block text-sm" id="digest-crit-cnt">0</span>
                        <span class="text-[10px] text-slate-400">Критических</span>
                    </div>
                    <div class="bg-surface-950 p-2 rounded-xl border border-slate-800">
                        <span class="text-amber-400 font-bold block text-sm" id="digest-warn-cnt">0</span>
                        <span class="text-[10px] text-slate-400">Предупреждений</span>
                    </div>
                    <div class="bg-surface-950 p-2 rounded-xl border border-slate-800">
                        <span class="text-cyan-400 font-bold block text-sm" id="digest-info-cnt">0</span>
                        <span class="text-[10px] text-slate-400">Инфо-событий</span>
                    </div>
                </div>
            </div>

            <!-- Recommendations -->
            <div class="space-y-2">
                <span class="text-xs font-semibold text-slate-300 block">Рекомендации системы:</span>
                <div id="digest-recommendations" class="bg-surface-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-1.5">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Actions: Send to Telegram -->
            <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
                <button onclick="sendDigestToTelegram()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium flex items-center space-x-1.5 transition shadow-lg shadow-indigo-600/20">
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                    <span>Отправить в Telegram</span>
                </button>
                <button onclick="closeDigestModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-xl font-medium">Закрыть</button>
            </div>
        </div>
    </div>
