    <!-- Modal: Command Palette (Ctrl+K) -->
    <div id="command-palette-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md hidden flex items-start justify-center pt-14 sm:pt-20 p-3 sm:p-4 transition-all duration-200">
        <div class="bg-surface-900 border border-slate-700/80 rounded-2xl max-w-2xl w-full max-h-[82vh] flex flex-col shadow-2xl overflow-hidden">
            <!-- Search Input Bar -->
            <div class="p-3.5 border-b border-slate-800 flex items-center space-x-3 bg-surface-950/60 shrink-0">
                <i data-lucide="search" class="w-5 h-5 text-indigo-400 shrink-0"></i>
                <input
                    id="cmd-palette-input"
                    type="text"
                    placeholder="Поиск по имени, IP, MAC, вендору или названию раздела..."
                    class="w-full bg-transparent border-none text-slate-100 placeholder-slate-500 text-sm focus:outline-none font-medium"
                    autocomplete="off"
                    spellcheck="false"
                >
                <div class="flex items-center space-x-1.5 shrink-0">
                    <button onclick="clearCommandPaletteInput()" id="cmd-palette-clear-btn" class="hidden text-slate-500 hover:text-slate-300 p-1 rounded-lg transition" title="Очистить поиск">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                    <kbd class="px-2 py-0.5 rounded text-[10px] font-mono bg-slate-800 border border-slate-700 text-slate-400">ESC</kbd>
                </div>
            </div>

            <!-- Quick Filter Chips -->
            <div class="px-4 py-2 bg-surface-900 border-b border-slate-800/80 flex items-center space-x-2 text-xs shrink-0 overflow-x-auto">
                <button onclick="setCommandPaletteCategory('all')" id="cmd-cat-all" class="cmd-cat-chip px-2.5 py-1 rounded-lg font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 transition">
                    Все
                </button>
                <button onclick="setCommandPaletteCategory('devices')" id="cmd-cat-devices" class="cmd-cat-chip px-2.5 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 border border-slate-800 hover:text-slate-200 transition">
                    Устройства
                </button>
                <button onclick="setCommandPaletteCategory('navigation')" id="cmd-cat-navigation" class="cmd-cat-chip px-2.5 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 border border-slate-800 hover:text-slate-200 transition">
                    Команды & Разделы
                </button>
            </div>

            <!-- Results Scrollable List -->
            <div id="cmd-palette-results" class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar min-h-[220px] max-h-[50vh]">
                <!-- Populated dynamically by JS -->
            </div>

            <!-- Footer Toolbar / Hints -->
            <div class="px-4 py-2.5 bg-surface-950/80 border-t border-slate-800 text-[11px] text-slate-400 flex flex-wrap items-center justify-between gap-2 shrink-0">
                <div class="flex items-center space-x-3">
                    <span class="flex items-center space-x-1">
                        <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-[10px] font-mono text-slate-300">↑↓</kbd>
                        <span>Навигация</span>
                    </span>
                    <span class="flex items-center space-x-1">
                        <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-[10px] font-mono text-slate-300">↵</kbd>
                        <span>Выбрать</span>
                    </span>
                    <span class="flex items-center space-x-1">
                        <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-[10px] font-mono text-slate-300">Esc</kbd>
                        <span>Закрыть</span>
                    </span>
                </div>
                <div id="cmd-palette-match-count" class="text-slate-500 font-mono text-[10px]">0 совпадений</div>
            </div>
        </div>
    </div>
