    <!-- Modal: Active Keenetic DNS Sinkhole Rules Manager -->
    <div id="dns-active-rules-modal" class="fixed inset-0 z-[70] bg-black/75 backdrop-blur-md hidden flex items-center justify-center p-3 sm:p-4">
        <div class="bg-surface-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-5 sm:p-6 shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 shrink-0">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-400">
                        <i data-lucide="list-filter" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h3 class="font-bold text-base text-white">Активные правила DNS-фильтра Keenetic</h3>
                            <span id="dns-active-rules-modal-badge" class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">0 правил</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5">Управление статическими блокировками (0.0.0.0), настроенными на роутере</p>
                    </div>
                </div>
                <button type="button" onclick="closeDnsActiveRulesModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Quick Add Custom Domain Form -->
            <div class="p-3 bg-surface-950 rounded-xl border border-slate-800 space-y-2 shrink-0">
                <label class="block text-xs font-semibold text-slate-300">Добавить произвольный домен в 0.0.0.0:</label>
                <div class="flex items-center space-x-2">
                    <div class="relative flex-1">
                        <i data-lucide="globe" class="w-4 h-4 text-slate-500 absolute left-3 top-2.5"></i>
                        <input type="text" id="manual-sinkhole-domain-input" placeholder="Например: tracking.example.com" class="w-full bg-surface-900 border border-slate-700 rounded-xl pl-9 pr-3 py-2 text-xs text-white font-mono focus:border-indigo-500 focus:outline-none" onkeydown="if(event.key === 'Enter') addCustomDnsSinkholeRule()">
                    </div>
                    <button type="button" onclick="addCustomDnsSinkholeRule()" id="btn-add-manual-sinkhole" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs rounded-xl font-semibold transition flex items-center space-x-1.5 shrink-0 shadow-sm">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Добавить</span>
                    </button>
                </div>
                <p class="text-[11px] text-slate-400">Роутер будет немедленно отвечать 0.0.0.0 на любые DNS-запросы к указанному имени.</p>
            </div>

            <!-- Active Rules List -->
            <div class="space-y-2 flex-1 overflow-y-auto pr-1">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-300">Текущие записи на роутере</span>
                    <button type="button" onclick="refreshDnsActiveRulesModal()" class="text-[11px] text-indigo-400 hover:text-indigo-300 flex items-center space-x-1">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                        <span>Обновить</span>
                    </button>
                </div>
                <div id="dns-active-rules-container" class="space-y-1.5">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="pt-3 border-t border-slate-800 flex items-center justify-between shrink-0">
                <button type="button" onclick="unblockAllDnsSinkholesFromModal()" id="btn-modal-unblock-all" class="px-3.5 py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 text-xs rounded-xl font-medium transition flex items-center space-x-1.5">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    <span>Очистить все правила с роутера</span>
                </button>
                <button type="button" onclick="closeDnsActiveRulesModal()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl font-medium transition">
                    Закрыть
                </button>
            </div>
        </div>
    </div>

    <!-- Sticky Floating Draft Bar for Rules Reordering -->
    <div id="rules-draft-bar" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-surface-900/95 border border-indigo-500/50 shadow-2xl rounded-2xl px-6 py-3 flex items-center space-x-4 backdrop-blur-md hidden animate-in slide-in-from-bottom-5">
        <div class="flex items-center space-x-2 text-xs text-amber-300 font-medium">
            <i data-lucide="alert-circle" class="w-4 h-4 text-amber-400 animate-pulse"></i>
            <span>Есть несохраненные изменения порядка правил</span>
        </div>
        <div class="h-4 w-px bg-slate-700"></div>
        <div class="flex items-center space-x-2">
            <button onclick="discardRuleChanges()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition cursor-pointer">Сбросить</button>
            <button onclick="saveRuleOrder(false)" id="btn-save-rule-order" class="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow-lg shadow-indigo-600/30 flex items-center space-x-1.5 transition cursor-pointer">
                <i data-lucide="save" class="w-3.5 h-3.5"></i>
                <span>Сохранить изменения</span>
            </button>
        </div>
    </div>
