    <!-- Modal: Web UI Login Authentication -->
    <div id="login-modal" class="fixed inset-0 z-[100] bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-4 select-none">
        <div class="bg-surface-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl space-y-6 animate-in fade-in zoom-in-95 duration-200">
            <!-- Header Icon & Titles -->
            <div class="text-center space-y-2">
                <div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i data-lucide="lock" class="w-7 h-7 text-white"></i>
                </div>
                <h2 class="text-xl font-bold text-white">KeenGuard Security</h2>
                <p class="text-xs text-slate-400">Веб-интерфейс защищен от несанкционированного доступа из локальной сети</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="submitLogin(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-300">Пароль администратора</label>
                    <div class="relative">
                        <i data-lucide="key" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
                        <input type="password" id="login-password-input" placeholder="Введите пароль..." required autofocus class="w-full bg-surface-950 border border-slate-700 rounded-xl pl-10 pr-10 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 font-mono transition">
                        <button type="button" onclick="toggleLoginPasswordVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-200 p-0.5" title="Показать/скрыть пароль">
                            <i data-lucide="eye" id="login-pwd-eye-icon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Error Box -->
                <div id="login-error-box" class="hidden p-3 rounded-xl bg-rose-950/40 border border-rose-500/40 text-xs text-rose-300 flex items-start space-x-2">
                    <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
                    <span id="login-error-message">Неверный пароль</span>
                </div>

                <button type="submit" id="btn-login-submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white text-sm rounded-xl font-bold transition shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span id="login-submit-text">Войти в панель</span>
                </button>
            </form>

            <div class="text-center text-[11px] text-slate-500 flex items-center justify-center space-x-1.5">
                <i data-lucide="shield-check" class="w-3.5 h-3.5 text-slate-500"></i>
                <span>Защита от перебора: 5 попыток / 15 минут</span>
            </div>
        </div>
    </div>
