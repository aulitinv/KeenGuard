    <!-- Modal: Custom LAN Policy Preset Editor -->
    <div id="custom-preset-modal" class="fixed inset-0 z-[60] bg-black/75 backdrop-blur-md hidden flex items-center justify-center p-3 sm:p-4">
        <div class="bg-surface-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-3">
                    <div class="p-2 rounded-xl bg-indigo-500/10 text-indigo-400">
                        <i data-lucide="layers" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 id="custom-preset-modal-title" class="font-bold text-base text-white">Новый пресет сетевой политики LAN</h3>
                        <p class="text-xs text-slate-400">Настройка ролевых правил доступа к портам</p>
                    </div>
                </div>
                <button type="button" onclick="closeCustomPresetModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="custom-preset-form" onsubmit="saveCustomPresetForm(event)" class="space-y-3.5 text-xs">
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Идентификатор (ID, латиница):</label>
                    <input type="text" id="preset-form-id" placeholder="preset_custom_nas" class="w-full bg-surface-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono">
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Название пресета:</label>
                    <input type="text" id="preset-form-name" placeholder="Домашнее хранилище (NAS)" required class="w-full bg-surface-950 border border-slate-700 rounded-xl px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Описание назначения:</label>
                    <input type="text" id="preset-form-desc" placeholder="Разрешает SMB и DLNA, блокирует SSH" class="w-full bg-surface-950 border border-slate-700 rounded-xl px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Разрешенные порты (allowed_ports, через запятую):</label>
                    <input type="text" id="preset-form-allowed" placeholder="80, 443, 445, 8200" class="w-full bg-surface-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono">
                    <span class="text-[10px] text-slate-500">Доступ к этим портам не вызывает алертов</span>
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Порты под наблюдением (alert_ports, через запятую):</label>
                    <input type="text" id="preset-form-alert" placeholder="22, 23" class="w-full bg-surface-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono">
                    <span class="text-[10px] text-slate-500">Попытки доступа генерируют предупреждение (warning)</span>
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Порты автокарантина (quarantine_ports, через запятую):</label>
                    <input type="text" id="preset-form-quarantine" placeholder="3389, 5555" class="w-full bg-surface-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono">
                    <span class="text-[10px] text-slate-500">Попытки доступа генерируют критическую тревогу (critical) и карантин</span>
                </div>

                <div class="pt-3 border-t border-slate-800 flex items-center justify-end space-x-2">
                    <button type="button" onclick="closeCustomPresetModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl font-medium transition">
                        Отмена
                    </button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs rounded-xl font-medium transition shadow-lg shadow-indigo-600/20">
                        Сохранить пресет
                    </button>
                </div>
            </form>
        </div>
    </div>
