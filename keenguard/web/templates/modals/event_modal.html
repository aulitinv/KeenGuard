    <!-- Modal: Security Event Details -->
    <div id="event-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-surface-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-3">
                    <div id="event-modal-icon-container" class="p-2 rounded-xl bg-amber-500/10 text-amber-400">
                        <i data-lucide="alert-triangle" id="event-modal-icon" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span id="event-modal-type-badge" class="px-2 py-0.5 rounded text-xs font-bold border bg-amber-500/20 text-amber-300 border-amber-500/30">EVENT</span>
                            <span id="event-modal-severity-badge" class="text-[11px] font-medium text-slate-400">Warning</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5" id="event-modal-time">08.09.2026, 12:00:00</p>
                    </div>
                </div>
                <button onclick="closeEventModal()" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Description Banner -->
            <div class="p-3 rounded-xl bg-surface-950 border border-slate-800/80">
                <span class="text-[10px] text-slate-500 uppercase tracking-wider block mb-1">Событие</span>
                <p id="event-modal-description" class="text-xs text-slate-200 font-medium leading-relaxed"></p>
            </div>

            <!-- Device Info Card (if target device is attached) -->
            <div id="event-modal-device-box" class="hidden p-3 rounded-xl bg-surface-950 border border-slate-800 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[10px] text-slate-500 uppercase tracking-wider">Связанное устройство</span>
                    <button id="event-modal-goto-device-btn" onclick="goToEventDevice()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center space-x-1 font-medium transition">
                        <span>Карточка устройства</span>
                        <i data-lucide="external-link" class="w-3 h-3"></i>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <span class="text-slate-500 text-[11px] block">Имя хоста:</span>
                        <span id="event-modal-device-name" class="font-bold text-white truncate block"></span>
                    </div>
                    <div>
                        <span class="text-slate-500 text-[11px] block">IP / MAC:</span>
                        <span id="event-modal-device-ipmac" class="font-mono text-slate-300 text-[11px] block"></span>
                    </div>
                </div>
            </div>

            <!-- Source Info Card (if attacker / sender IP/MAC exists) -->
            <div id="event-modal-source-box" class="hidden p-3 rounded-xl bg-surface-950 border border-slate-800 space-y-1">
                <span class="text-[10px] text-slate-500 uppercase tracking-wider block">Источник запроса (Атакующий / Инициатор)</span>
                <div class="flex items-center space-x-2 text-xs font-mono text-rose-300">
                    <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-rose-400"></i>
                    <span id="event-modal-source-val"></span>
                </div>
            </div>

            <!-- Structured Details / Forensics -->
            <div class="space-y-2">
                <span class="text-xs font-semibold text-slate-300 block">Детализация и параметры инцидента:</span>
                <div id="event-modal-details-content" class="bg-surface-950 p-3.5 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-2 max-h-60 overflow-y-auto">
                    <!-- Dynamic details content -->
                </div>
            </div>

            <!-- Modal Action Buttons -->
            <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
                <div id="event-modal-extra-actions" class="flex items-center space-x-2">
                    <!-- Dynamic extra buttons like "Open Audit Report" or "Download PCAP" -->
                </div>
                <div class="flex items-center space-x-2">
                    <button id="btn-delete-event-modal" onclick="deleteCurrentEvent()" class="px-3.5 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 text-xs rounded-xl font-medium flex items-center space-x-1.5 transition">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        <span>Удалить инцидент</span>
                    </button>
                    <button onclick="closeEventModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-xl font-medium">Закрыть</button>
                </div>
            </div>
        </div>
    </div>
