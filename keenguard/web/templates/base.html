<!DOCTYPE html>
<html lang="ru" class="dark">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        surface: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
</head>
<body class="bg-surface-950 text-slate-100 h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white overflow-hidden">

    <!-- Top Navigation Header -->

        <div class="flex items-center space-x-3">
            <button id="mobile-sidebar-toggle-btn" onclick="toggleSidebar()" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition mr-1" title="Меню навигации">

            </button>
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">

            </div>
            <div>

                    <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">KeenGuard</h1>
                    <span class="text-xs px-2 py-0.5 rounded-full font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">v1.0.0</span>
                </div>
                <p class="text-xs text-slate-400">Сетевой аудит & расследования Keenetic</p>
            </div>
        </div>

        <!-- Quick Command Search (Ctrl+K) -->

                <span class="text-slate-400 group-hover:text-slate-300">Быстрый поиск...</span>

            </button>
            <button onclick="openCommandPalette()" class="md:hidden p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white border border-slate-700 transition" title="Быстрый поиск (Ctrl+K)">
                <i data-lucide="search" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Quick Status Badges -->
        <div class="flex items-center space-x-4">
            <div id="router-status-badge" onclick="switchTab('settings')" title="Кликните для перехода к настройкам роутера" class="cursor-pointer hover:bg-slate-700/80 transition flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 border border-slate-700">

            <div class="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 border border-slate-700">
                <i data-lucide="moon" class="w-3.5 h-3.5 text-indigo-400"></i>
                <span id="night-status-text" class="text-slate-300">Ночной режим: Авто</span>
            </div>
            <div class="flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 border border-slate-700">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="text-slate-300">Порт: 9989</span>
            </div>
            <div id="auth-status-badge" onclick="navigateToSettingsSubTab('web-access')" title="Сетевой доступ и защита интерфейса" class="cursor-pointer hover:bg-slate-700/80 transition flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 border border-slate-700">
                <i data-lucide="shield-check" id="auth-status-icon" class="w-3.5 h-3.5 text-emerald-400"></i>
                <span id="auth-status-text" class="text-slate-300">127.0.0.1 (Локально)</span>
            </div>
            <button onclick="logout()" id="btn-header-lock" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 border border-slate-700 transition" title="Заблокировать сессию / Экран авторизации">

            </button>

        <div class="flex items-center space-x-3">
            <span class="relative flex h-2.5 w-2.5 shrink-0">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span>
            </span>
            <div class="flex items-center space-x-2 flex-wrap">
                <span class="font-bold text-rose-200">🔴 Идет глубокий DPI-захват пакетов сетевой картой:</span>
                <span id="global-dpi-target-text" class="text-white font-mono bg-rose-950/60 px-2 py-0.5 rounded border border-rose-500/30">Вся сеть</span>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-rose-200 text-xs flex items-center space-x-1.5" id="global-dpi-timer-text">

            </button>
        </div>

                <button onclick="switchTab('rules')" id="tab-rules" data-tooltip="Правила и фильтры" title="Правила & Фильтры (Rules Engine)" class="tab-btn flex items-center space-x-3 px-3 py-2 rounded-xl text-sm font-medium transition w-full text-left">
